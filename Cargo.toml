[package]
name = "gpui-canvas"
version = "0.1.0"
edition = "2021"
authors = ["Ashraf Latif <n8y99zlby@mozmail.com>"]
description = "Interactive 2D vector canvas and polygon annotation widget for GPUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ceghap/gpui-canvas-"
readme = "README.md"
keywords = ["gpui", "canvas", "vector", "polygon", "annotations"]
categories = ["gui", "graphics"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["wayland", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed" }

[[example]]
name = "threat_zones"
path = "examples/threat_zones.rs"
